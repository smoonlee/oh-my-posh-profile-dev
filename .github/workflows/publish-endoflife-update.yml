name: Publish EndOfLife Catalog Update

on:
  pull_request:
    types: [closed]

permissions:
  actions: write
  contents: write

concurrency:
  group: publish-endoflife-update
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'automation/update-endoflife-products'
    runs-on: ubuntu-latest
    steps:
      - name: Check out merged catalog update
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Read prepared version and release notes
        shell: pwsh
        run: |
          $profile = Get-Content ./src/profile/Microsoft.PowerShell_profile.ps1 -Raw
          if ($profile -notmatch "(?m)^\s*\`$script:PwshProfileVersion\s*=\s*'(?<version>[^']+)'\s*$") {
            throw 'Could not read the prepared profile version.'
          }
          $version = $Matches.version
          $changelog = Get-Content ./CHANGELOG.md -Raw
          $pattern = "(?ms)^## \[$([regex]::Escape($version))\](?: - \d{4}-\d{2}-\d{2})?\s*\r?\n(?<notes>.*?)(?=^## \[|\z)"
          if ($changelog -notmatch $pattern) {
            throw "CHANGELOG.md does not contain release notes for '$version'."
          }
          $notesPath = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          [IO.File]::WriteAllText($notesPath, $Matches.notes.Trim(), [Text.UTF8Encoding]::new($false))
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
          "RELEASE_TAG=v$version" >> $env:GITHUB_ENV
          "RELEASE_NOTES_PATH=$notesPath" >> $env:GITHUB_ENV
          "RELEASE_PRERELEASE=$($version.Contains('-'))" >> $env:GITHUB_ENV

      - name: Create draft GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            $tagCommit = gh api "repos/$env:GITHUB_REPOSITORY/commits/$env:RELEASE_TAG" --jq .sha
            if ($tagCommit -ne $env:TARGET_SHA) {
              throw "Release $env:RELEASE_TAG already points to $tagCommit instead of this merge ($env:TARGET_SHA). Prepare a new version before publishing."
            }
            Write-Host "Release $env:RELEASE_TAG already exists; continuing with asset publication."
          } else {
            $arguments = @(
              'release', 'create', $env:RELEASE_TAG,
              '--target', $env:TARGET_SHA,
              '--title', $env:RELEASE_TAG,
              '--notes-file', $env:RELEASE_NOTES_PATH,
              '--draft'
            )
            if ([Convert]::ToBoolean($env:RELEASE_PRERELEASE)) {
              $arguments += '--prerelease'
            }
            gh @arguments
            if ($LASTEXITCODE -ne 0) { throw "Failed to create $env:RELEASE_TAG." }
          }

      - name: Start immutable asset publication
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run publish-profile-release.yml `
            --ref ${{ github.event.repository.default_branch }} `
            -f release_tag=$env:RELEASE_TAG
