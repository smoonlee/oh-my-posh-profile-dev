name: Update Nerd Fonts catalog

on:
  schedule:
    - cron: '0 6 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: update-nerd-fonts-catalog
  cancel-in-progress: false

jobs:
  update:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Scrape Nerd Fonts catalog
        shell: pwsh
        run: ./scripts/Update-NerdFontsCatalog.ps1

      - name: Create Nerd Fonts update pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/update-nerd-fonts
          delete-branch: true
          add-paths: |
            NerdFontsCatalog.json
            Invoke-PwshProfileSetup.ps1
          commit-message: 'chore: update Nerd Fonts catalog'
          title: 'chore: update Nerd Fonts catalog'
          body: |
            Automated weekly update from https://www.nerdfonts.com/font-downloads.

            This refreshes the supported friendly font names, archive names,
            Nerd Fonts release, and upstream font versions.
          assignees: smoonlee
